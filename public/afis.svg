<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(54, 75%, 45%)" />
      <stop offset="100%" stop-color="hsl(45, 80%, 30%)" />
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#gradBg)" />

  <!-- Geometric Decorative Patterns -->
  <circle cx="100" cy="80" r="140" fill="hsl(54, 65%, 60%)" opacity="0.25" />
  <circle cx="720" cy="120" r="180" fill="hsl(48, 80%, 65%)" opacity="0.2" />
  <circle cx="400" cy="520" r="260" fill="hsl(54, 70%, 25%)" opacity="0.4" />

  <!-- Stars / Sparkles -->
  <path d="M 680 70 Q 690 90 710 90 Q 690 90 680 110 Q 670 90 650 90 Q 670 90 680 70 Z" fill="#fff" opacity="0.8" />
  <path d="M 140 180 Q 146 195 160 195 Q 146 195 140 210 Q 134 195 120 195 Q 134 195 140 180 Z" fill="#fff" opacity="0.7" />
  <path d="M 280 60 Q 285 72 300 72 Q 285 72 280 85 Q 275 72 260 72 Q 275 72 280 60 Z" fill="#fff" opacity="0.6" />

  <!-- Campus Silhouette -->
  <g fill="hsl(54, 40%, 20%)" opacity="0.35">
    <rect x="60" y="310" width="80" height="150" rx="4" />
    <polygon points="100,260 50,310 150,310" />
    <rect x="180" y="340" width="100" height="120" rx="4" />
    <rect x="320" y="290" width="160" height="170" rx="6" />
    <polygon points="400,230 310,290 490,290" />
    <!-- Clock Tower -->
    <rect x="385" y="210" width="30" height="40" />
    <circle cx="400" cy="225" r="8" fill="hsl(54, 60%, 85%)" />
    <rect x="520" y="330" width="120" height="130" rx="4" />
    <rect x="670" y="320" width="70" height="140" rx="4" />
  </g>

  <!-- Overlay -->
  <rect width="800" height="500" rx="16" fill="url(#overlayGrad)" />

  <!-- Center Card Badge / Graphic -->
  <g filter="url(#shadow)">
    <!-- Main Badge -->
    <rect x="120" y="100" width="560" height="280" rx="20" fill="rgba(255, 255, 255, 0.95)" />
    
    <!-- Decorative Icon / Graduation & Calendar -->
    <circle cx="400" cy="155" r="36" fill="hsl(54, 65%, 38%)" />
    <!-- Graduation Cap Icon -->
    <path d="M 378 152 L 400 142 L 422 152 L 400 162 Z" fill="#fff" />
    <path d="M 387 157 L 387 167 C 387 172 413 172 413 167 L 413 157" fill="none" stroke="#fff" stroke-width="2.5" />
    <path d="M 418 155 L 424 165 L 424 175" fill="none" stroke="#fff" stroke-width="2" />
    
    <!-- Title & Typography -->
    <text x="400" y="225" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="hsl(54, 65%, 25%)" text-anchor="middle">
      KAMPÜS ETKİNLİKLERİ
    </text>
    <text x="400" y="255" font-family="Georgia, serif" font-size="16" fill="hsl(54, 30%, 45%)" text-anchor="middle">
      Seminerler • Atölyeler • Söyleşiler • Yarışmalar
    </text>
    
    <!-- Pill Badges -->
    <g transform="translate(180, 280)">
      <rect x="0" y="0" width="95" height="30" rx="15" fill="hsl(54, 65%, 92%)" stroke="hsl(54, 65%, 38%)" stroke-width="1.2" />
      <text x="47" y="19" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="hsl(54, 65%, 30%)" text-anchor="middle">Seminer</text>
    </g>
    <g transform="translate(290, 280)">
      <rect x="0" y="0" width="95" height="30" rx="15" fill="hsl(54, 65%, 92%)" stroke="hsl(54, 65%, 38%)" stroke-width="1.2" />
      <text x="47" y="19" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="hsl(54, 65%, 30%)" text-anchor="middle">Atölye</text>
    </g>
    <g transform="translate(400, 280)">
      <rect x="0" y="0" width="95" height="30" rx="15" fill="hsl(54, 65%, 92%)" stroke="hsl(54, 65%, 38%)" stroke-width="1.2" />
      <text x="47" y="19" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="hsl(54, 65%, 30%)" text-anchor="middle">Söyleşi</text>
    </g>
    <g transform="translate(510, 280)">
      <rect x="0" y="0" width="95" height="30" rx="15" fill="hsl(54, 65%, 92%)" stroke="hsl(54, 65%, 38%)" stroke-width="1.2" />
      <text x="47" y="19" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="hsl(54, 65%, 30%)" text-anchor="middle">Yarışma</text>
    </g>
    
    <text x="400" y="345" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#777" text-anchor="middle">
      Öğrenci: Eren Cem Çelik • No: 2321032014
    </text>
  </g>
</svg>
